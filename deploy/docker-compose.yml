######################################################################
# SECURITY WARNING
# 所有默认密码都是占位符，部署前必须修改！！！
######################################################################

# New-API 部署配置
#
# 方式一：SQLite（最简单，单机使用）
#   直接运行 new-api.exe 即可，数据保存在当前目录 data.db
#
# 方式二：PostgreSQL（推荐生产使用）
#   1. 修改下方 SQL_DSN 密码
#   2. docker-compose up -d postgres redis
#   3. 设置 SQL_DSN 环境变量后启动 new-api
#
# 方式三：MySQL
#   取消注释 mysql 服务，修改 SQL_DSN 为 MySQL 连接串

version: '3.4'

services:
  new-api:
    image: calciumion/new-api:latest
    # 如果用自己的镜像，改为：
    # image: your-registry/new-api:custom
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # ===== 必改项 =====
      - SQL_DSN=postgresql://root:CHANGE_ME@postgres:5432/new-api
      # - SQL_DSN=root:CHANGE_ME@tcp(mysql:3306)/new-api  # MySQL 用这行
      - REDIS_CONN_STRING=redis://:CHANGE_ME@redis:6379
      - TZ=Asia/Shanghai
      # ===== 建议配置 =====
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
      - ERROR_LOG_ENABLED=true
      # 多机部署必须设置（重启不会失效）
      # - SESSION_SECRET=改成随机字符串
      # HTTPS 部署必须设置
      # - SESSION_COOKIE_SECURE=true
      # - SESSION_COOKIE_TRUSTED_URL=https://your-domain.com
    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "CHANGE_ME"]
    volumes:
      - redis_data:/data
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network

  # MySQL（取消注释使用）
  # mysql:
  #   image: mysql:8.2
  #   container_name: mysql
  #   restart: always
  #   environment:
  #     MYSQL_ROOT_PASSWORD: CHANGE_ME
  #     MYSQL_DATABASE: new-api
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - new-api-network

volumes:
  pg_data:
  redis_data:
  # mysql_data:

networks:
  new-api-network:
    driver: bridge
